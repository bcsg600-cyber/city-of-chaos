<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mercedes W222 Model Test — City of Chaos</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10141c;color:#f4f6fb;font:14px system-ui,sans-serif}
canvas{display:block}#panel{position:fixed;top:14px;left:14px;max-width:min(420px,calc(100vw - 28px));padding:14px 16px;background:#111827eF;border:1px solid #374151;border-radius:12px;line-height:1.5;z-index:2}
#panel h1{font-size:17px;margin:0 0 7px}#status{color:#a7f3d0}#detail{color:#cbd5e1;font-size:12px;margin-top:6px}
#hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);padding:8px 12px;background:#111827d9;border-radius:8px;color:#cbd5e1;white-space:nowrap}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="panel"><h1>Mercedes W222 — isolated model test</h1><div id="status">Loading FBX model…</div><div id="detail">This preview does not change the cars in the main game. Drag to rotate; scroll or pinch to zoom.</div></div>
<div id="hint">Drag: rotate · Scroll: zoom</div>
<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const status=document.getElementById('status'), detail=document.getElementById('detail');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x202936);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,1000);
camera.position.set(9,6,10);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace; document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x344155,2));
const key=new THREE.DirectionalLight(0xffffff,3); key.position.set(7,12,8); key.castShadow=true; scene.add(key);
const fill=new THREE.DirectionalLight(0x9bbcff,1.2); fill.position.set(-8,4,-6); scene.add(fill);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0x303945,roughness:.9}));
floor.rotation.x=-Math.PI/2; floor.position.y=-.03; floor.receiveShadow=true; scene.add(floor);
const grid=new THREE.GridHelper(30,30,0x718096,0x465364); grid.position.y=-.02; scene.add(grid);
const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true; controls.target.set(0,1,0); controls.minDistance=2; controls.maxDistance=50;
const manager=new THREE.LoadingManager();
manager.setURLModifier(url=>{
  if(/\.(png|jpe?g|tga|dds)(\?.*)?$/i.test(url) || /MB_W222_Photo_Textures|Tire_Wheel_/i.test(url)){
    const svg='<svg xmlns="http://www.w3.org/2000/svg" width="4" height="4"><rect width="4" height="4" fill="#aaa"/></svg>';
    return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  }
  return url;
});
const loader=new FBXLoader(manager);
loader.load('./uploads_files_3750868_MB.W222.AMG.fbx',root=>{
  root.name='Mercedes-W222-test';
  root.traverse(o=>{
    if(o.isMesh){
      o.visible=true; o.castShadow=true; o.receiveShadow=true;
      const mats=Array.isArray(o.material)?o.material:[o.material];
      for(const m of mats){if(m){m.visible=true;m.side=THREE.DoubleSide;m.transparent=false;m.opacity=1;m.needsUpdate=true;}}
    }
  });
  const box=new THREE.Box3().setFromObject(root), size=box.getSize(new THREE.Vector3()), center=box.getCenter(new THREE.Vector3());
  if(!Number.isFinite(size.x)||size.lengthSq()<1e-8){status.textContent='Loaded, but no visible geometry was detected.';status.style.color='#fca5a5';return;}
  root.position.sub(center);
  const maxDim=Math.max(size.x,size.y,size.z);
  root.scale.setScalar(6/maxDim);
  scene.add(root);
  const fitted=new THREE.Box3().setFromObject(root), fittedSize=fitted.getSize(new THREE.Vector3());
  controls.target.set(0,fittedSize.y*.42,0);
  camera.position.set(fittedSize.x*1.7,fittedSize.y*1.05,fittedSize.z*1.9);
  camera.near=.01; camera.far=1000; camera.updateProjectionMatrix(); controls.update();
  let meshes=0,vertices=0,names=[];
  root.traverse(o=>{if(o.isMesh){meshes++;vertices+=o.geometry?.attributes?.position?.count||0;if(names.length<20)names.push(o.name||'(unnamed mesh)');}});
  status.textContent='FBX loaded — geometry detected';
  detail.textContent='Meshes: '+meshes+' · Vertices: '+vertices+' · Original dimensions: '+size.x.toFixed(2)+' × '+size.y.toFixed(2)+' × '+size.z.toFixed(2)+' · Texture files are substituted with a neutral preview texture because they are not included with this FBX upload. Meshes: '+names.join(', ');
},xhr=>{
  if(xhr.total) status.textContent='Loading FBX… '+Math.round(xhr.loaded/xhr.total*100)+'%';
},error=>{
  console.error(error);status.textContent='Could not load FBX. Check the browser console.';status.style.color='#fca5a5';detail.textContent=String(error);
});
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);} animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
